<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>VLC Redesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vlcmedia: http: https:; media-src 'self' blob: vlcmedia: http: https:; connect-src 'self' vlcmedia: http: https:; font-src 'self'">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
  <div id="app" class="mode-library">
    <header id="topbar"></header>
    <div id="body">
      <nav id="nav"></nav>
      <aside id="queuePanel" hidden></aside>
      <main id="main">
        <div id="viewRoot"></div>
        <section id="stage" hidden>
          <div id="stageArt"></div>
          <div id="mediaSlot"></div>
          <div id="stageTitle"></div>
          <div id="stageMsg"></div>
        </section>
      </main>
    </div>
    <footer id="controls" hidden></footer>
    <div id="mini" hidden></div>
    <div id="dropHint" hidden>Drop media files or folders to play them</div>
    <div id="overlays"></div>
    <div id="toasts"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
